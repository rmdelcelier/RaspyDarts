# Menus par défaut de RaspyDarts (voir docs/menu/menus.md).
#
# Ne pas modifier ce fichier pour personnaliser les menus : il est remplacé à chaque mise à
# jour. Écrire plutôt ~/.raspydarts/menus.yaml (ou le menus.yaml d'un thème), qui ne
# contient que ce qui change.

version: 1
resolution: auto

defaults:
  style: classic
  layout: list

styles:
  # Les boutons de toujours : raccourci à gauche, texte, couleurs du thème (Colorset.cfg)
  classic:
    # Comme les boutons classiques du thème : texte à la hauteur du bouton, aligné et coloré
    # comme eux (les raccourcis suivent aussi le thème, §7.1)
    background: {color: 'menu-buttons*1.5'}
    text: {size: auto, color: menu-text-black, align: theme}
  classic-tiles:
    # Comme les tuiles classiques du thème (logos des catégories) : fond à peine visible, le
    # logo remplit la tuile, la tuile choisie surlignée
    background: {color: menu-inactive, opacity: 0.08}
    radius: 0.17
    icon: {size: 1.0}
    text: {size: auto, color: menu-text-black, align: theme}
    selected: {background: {color: menu-selected, opacity: 1.0}}

navigation:
  up: [up, btn:up, dart:S20]
  down: [down, btn:down, dart:S3]
  left: [left, btn:left, dart:S11]
  right: [right, btn:right, dart:S6]
  next: []
  previous: []
  validate: [enter, btn:game, btn:validate, btn:nextplayer, dart:SB, dart:DB]
  back: [escape, btn:back, btn:cancel]

menus:
  main:
    title: game-type-menu
    show_version: true
    buttons:
      - id: local
        action: local_game
        text: game-type-local
        shortcut: F1
        exhibition: true
      # Online games : the rooms of the server, the chat, create or join a game
      # (include/cscreen.py network_lobby). Replaces netjoin and netcreate
      - id: network
        action: network
        text: online-title
        shortcut: F2
      - id: miscellaneous
        action: menu:miscellaneous
        text: miscellaneous
        shortcut: F4
      - id: trophees
        action: trophies
        text: trophees
        shortcut: F5
        exhibition: true
      - id: gallery
        action: gallery
        text: gallery
        shortcut: F6
        exhibition: true
      - id: mp3
        action: mp3
        text: music-player
        exhibition: true
      - id: infos
        action: infos
        shortcut: F9
        visible: false
      - id: restart
        action: restart
        shortcut: F11
        visible: false
      - id: quit
        action: desktop
        text: back-to-desktop
        shortcut: F12
        space_before: 1.5
      - id: shutdown
        action: shutdown
        text: exit
        shortcut: escape
        space_before: 0.5
        confirm: realy-stop

  miscellaneous:
    title: parameters
    info: [ips, rpi_version, version]
    remember: true
    buttons:
      - id: firstnames
        action: favorite_players
        text: favorites-players
        shortcut: F1
      - id: games
        action: favorite_games
        text: favorites-games
        shortcut: F2
      - id: servers
        action: favorite_servers
        text: favorites-servers
        shortcut: F3
      - id: customization
        action: customization
        text: customization
        shortcut: F4
      - id: animations
        action: animations
        text: animations
        shortcut: F5
      - id: firstname-bank
        action: players_bank
        text: players-bank
        shortcut: F6
      - id: setup
        action: menu:settings
        text: setup
        shortcut: F7
      - id: backups
        action: backups
        text: backups
        shortcut: F8
      - id: exhibition
        action: exhibition
        text: exhibition
        shortcut: F9
      # The DMD display Raspy2DMD on this machine (its screen offers to install it)
      - id: raspy2dmd
        action: raspy2dmd
        text: raspy2dmd
        shortcut: F10
      # Editor of the screens of menus on the borne (include/cmenueditor.py)
      - id: edit-screens
        action: edit_screens
        text: edit-screens
        shortcut: F11
      - id: back
        action: back
        text: back
        shortcut: escape
        footer: left
      - id: update
        action: update
        text: btn_update
        footer: right

  settings:
    title: setup
    remember: true
    # 4 columns arranged by themselves (a button added takes its place among the others)
    layout: tiles
    columns: 4
    buttons:
      - id: setup-buttons
        action: setup_buttons
        text: setup-buttons
        shortcut: F1
      - id: setup-pinleds
        action: setup_pins_leds
        text: setup-pinsleds
        shortcut: F2
      - id: setup-leds
        action: setup_leds
        text: setup-leds
        shortcut: F3
      - id: setup-couleurs-segments
        action: setup_segment_colors
        text: setup-couleurs-segments
        shortcut: F4
      - id: setup-cam
        action: setup_camera
        text: setup-cam
        shortcut: F5
      # Pads of keys and knobs plugged in USB (include/cusbpads.py)
      - id: usb-pads
        action: usb_pads
        text: usb-pads
        shortcut: F6
      # Coin acceptor, behind its password (include/ccoins.py)
      - id: coins
        action: coins
        text: coins
        shortcut: F7
      # LED of the buttons : their states and their blinking (include/cbuttonleds.py)
      - id: button-leds
        action: button_leds
        text: button-leds
        shortcut: F8
      - id: test-buttons
        action: test_buttons
        text: test-buttons
        shortcut: F9
      - id: test-target
        action: test_target
        text: test-target
        shortcut: F10
      - id: test-toys
        action: test_toys
        text: test-toys
        shortcut: F11
      - id: reset
        action: reset
        text: reset
        shortcut: F12
      - id: back
        action: back
        text: back
        shortcut: escape
        footer: left

  categories:
    title: game-cat
    layout: tiles
    buttons:
      - id: classic
        action: category:classic
        logo: menu_classic
        shortcut: F1
        dmd: dmd-game-classic
      - id: fun
        action: category:fun
        logo: menu_fun
        shortcut: F2
        dmd: dmd-game-fun
      - id: sport
        action: category:sport
        logo: menu_sport
        shortcut: F3
        dmd: dmd-game-sport
      - id: favorites
        action: category:favorites
        logo: menu_favoris
        shortcut: F4
        dmd: dmd-game-favorites
        requires: favorite_games
      - id: back
        action: back
        text: back
        shortcut: escape
        footer: left

  # Screens of the favorites (Jeux favoris) : their buttons come from the game. A favorite
  # game chosen again : its options changed or removed (title : the game)
  favorite_game: {}

  # A question answered by Yes or No (title : the question)
  question: {}

  # A favorite game placed on a button fav1 to fav9 of the main menu, then how its players
  # are chosen
  # Source of the tracks of the Lecteur MP3 (include/cscreen.py music_source_menu)
  music_source:
    title: music-source

  favorite_save:
    title: favorite-save
    subtitle: favorite-save-sub

  favorite_players:
    title: favorite-players
    subtitle: favorite-players-sub

  # Editor of the screens (include/cmenueditor.py) : the games which can be added, in columns
  editor_games:
    layout: grid
    columns: 4

  # Online games (include/cscreen.py network_lobby, include/cchat.py) : the keys and texts of
  # their buttons ; the screens draw them themselves (no layout here)
  online_lobby:
    buttons:
      # ready : a switch (green : the borne is seen online by the others, red : it is not)
      - id: ready
        text: online-ready
        shortcut: F1
      - id: chat
        text: online-chat
        shortcut: F2
      - id: create
        text: online-create
        shortcut: F3
      - id: server
        text: online-change-server
        shortcut: F4
      - id: account
        text: online-change-account
        shortcut: F5
      - id: back
        text: back
        shortcut: escape

  online_chat:
    buttons:
      - id: write
        text: online-write
        shortcut: F1
      - id: invite
        text: online-invite
        shortcut: F2
      - id: accept
        text: online-accept
        shortcut: F3
      - id: refuse
        text: online-refuse
        shortcut: F4
      - id: quick
        text: online-quick
        shortcut: F5
      - id: logout
        text: online-logout
        shortcut: F6
      - id: back
        text: back
        shortcut: escape
